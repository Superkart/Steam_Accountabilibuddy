# Netlify Configuration for SteamLens Frontend
# This file should be at the repository root when deploying via GitHub

# Proxy all API requests to backend VM
[[redirects]]
  from = "/api/*"
  to = "http://YOUR_GCP_STATIC_IP/api/:splat"
  status = 200
  force = true

# SPA fallback - all other routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  base = "frontend"
  publish = "frontend/dist"
  command = "npm run build"
