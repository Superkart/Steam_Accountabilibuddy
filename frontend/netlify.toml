# Netlify Configuration for SteamBuddy Frontend (for manual drag-and-drop deployment)
# This file gets copied to the dist folder and contains only redirects

# Proxy all API requests to backend
[[redirects]]
  from = "/api/*"
  to = "http://35.209.50.65/api/:splat"
  status = 200
  force = true

# SPA fallback - all other routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
