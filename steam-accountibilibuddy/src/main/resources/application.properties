spring.application.name=steam-accountibilibuddy
server.port=8080

# Base URL of this app (must match return_to realm when testing)
# In production, set APP_BASE_URL environment variable to your VM IP (e.g., http://34.123.45.67)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Frontend URL (for redirects after authentication)
# In production, set APP_FRONTEND_URL environment variable to your Netlify URL
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Steam endpoints / API key
steam.openid.endpoint=https://steamcommunity.com/openid/login
steam.api.key=${STEAM_API_KEY:}
steam.api.base=https://api.steampowered.com

logging.level.root=INFO
logging.level.com.yourorg=DEBUG

# Database Configuration (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/steambuddy}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Spring Security Session Configuration
spring.session.store-type=none
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=STEAMBUDDY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Email Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Scheduled Tasks
spring.task.scheduling.enabled=true